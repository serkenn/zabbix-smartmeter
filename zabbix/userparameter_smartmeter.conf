# Zabbix agent用 UserParameter（任意）
#
# 推奨構成では zabbix-smartmeter.timer が /var/lib/zabbix/smartmeter.json を更新し、
# Zabbix側は組み込みアイテム vfs.file.contents[] で読み取るため、
# UserParameterは不要です（同梱テンプレートはこちらを使います）。
#
# UserParameterキーで取得したい場合のみ、このファイルを
#   /etc/zabbix/zabbix_agent2.d/   （zabbix-agent2）
#   /etc/zabbix/zabbix_agentd.d/   （zabbix-agent）
# に配置して agent を再起動してください。
#
# キャッシュ済みJSONを読むだけなのでagentのTimeoutに引っかかりません。
UserParameter=smartmeter.get,/usr/bin/cat /var/lib/zabbix/smartmeter.json

# 非推奨: agentから直接スマートメーターを叩く方法。
# Bルートの応答は数十秒かかることがありagentのTimeout（最大30秒）を超えるうえ、
# SELinuxで zabbix_agent_t からシリアルポートへのアクセスが拒否されます。
#UserParameter=smartmeter.direct,/usr/bin/zabbix-smartmeter --json --device /dev/ttyUSB0 --dse
